# DigitalOcean App Platform spec: `doctl apps create --spec .do/app.yaml`,
# or Apps → Create → GitHub repo andrwlinx/leaf-on-read (it picks this file up).
# Values marked SECRET are placeholders; set them in the dashboard, never in git.
name: leaf-on-read
region: nyc
services:
  - name: api
    github:
      repo: andrwlinx/leaf-on-read
      branch: main
      deploy_on_push: true
    source_dir: api
    dockerfile_path: api/Dockerfile
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    routes:
      - path: /
    health_check:
      http_path: /health
    envs:
      - { key: DEMO_MODE, value: "1" }
      - { key: XAI_MODEL, value: grok-4.20-0309-non-reasoning }
      - { key: AGENT_URL, value: "http://agent:4000" }
      - { key: PUBLIC_API_URL, value: "${APP_URL}" }
      - { key: MONGODB_URI, type: SECRET, value: set-in-dashboard }
      - { key: TIGER_DATABASE_URL, type: SECRET, value: set-in-dashboard }
      - { key: XAI_API_KEY, type: SECRET, value: set-in-dashboard }
      - { key: ELEVENLABS_API_KEY, type: SECRET, value: set-in-dashboard }
      - { key: ELEVENLABS_VOICE_ID, value: JBFqnCBsd6RMkjVDRZzb }
      - { key: GEMINI_API_KEY, type: SECRET, value: set-in-dashboard }
  # iMessage bridge: no public route; the API reaches it on the internal network.
  - name: agent
    github:
      repo: andrwlinx/leaf-on-read
      branch: main
      deploy_on_push: true
    source_dir: agent
    dockerfile_path: agent/Dockerfile
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    internal_ports: [4000]
    envs:
      - { key: LEAF_API_URL, value: "http://api:8080" }
      - { key: AGENT_PORT, value: "4000" }
      - { key: PROJECT_ID, value: 4071420f-92aa-4ab9-a6b8-4407ee08ca44 }
      - { key: PROJECT_SECRET, type: SECRET, value: set-in-dashboard }
