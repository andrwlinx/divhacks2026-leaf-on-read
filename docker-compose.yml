services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - leaf_mongo:/data/db
  tiger:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leaf
    ports:
      - "5433:5432"
    volumes:
      - leaf_tiger:/var/lib/postgresql/data

volumes:
  leaf_mongo:
  leaf_tiger:
